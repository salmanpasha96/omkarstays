  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-mark"><img src="images/favicon.png" alt="Omkar Stays" height="34"></span>
        <span class="brand-text ms-2">Omkar Stays</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
          <li class="nav-item"><a class="nav-link" href="tents.html">Forest Tents</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>

          <li class="nav-item ms-lg-2"><a class="btn btn-accent btn-sm" href="contact.html">Book Now</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-hero" style="background:#204E37;color:#fff;padding:4rem 0 2rem 0">
    <div class="container text-center">
      <h1 class="hero-heading">Guest Feedback</h1>
      <p class="hero-sub">We value your stay and your story.</p>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="contact-panel">
            <h3 class="section-title mb-3" style="font-size:2rem">Share your experience</h3>
            <form id="feedbackForm" action="/api/feedback" method="POST" enctype="multipart/form-data" class="ajax-form">
              <div class="mb-3"><input class="form-control" name="name" placeholder="Your name" required></div>
              <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email"></div>
              <div class="mb-3"><input class="form-control" name="phone" placeholder="Phone"></div>

              <div class="mb-3">
                <label class="form-label">Your rating</label>
                <div class="star-rating" role="radiogroup" aria-label="Rate your experience">
                  <input type="radio" id="star5" name="rating" value="5" checked>
                  <label for="star5" title="5 stars">★</label>
                  <input type="radio" id="star4" name="rating" value="4">
                  <label for="star4" title="4 stars">★</label>
                  <input type="radio" id="star3" name="rating" value="3">
                  <label for="star3" title="3 stars">★</label>
                  <input type="radio" id="star2" name="rating" value="2">
                  <label for="star2" title="2 stars">★</label>
                  <input type="radio" id="star1" name="rating" value="1">
                  <label for="star1" title="1 star">★</label>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Your feedback</label>
                <textarea class="form-control" name="message" rows="5" placeholder="Tell us about your stay, room, food, service, or overall experience..." required></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label">Upload photos or a short video (optional, up to 10 MB each, max 10 files)</label>
                <input class="form-control" type="file" name="attachments" multiple accept="image/png, image/jpeg, image/webp, video/mp4, video/quicktime, video/webm">
              </div>

              <button class="btn btn-accent w-100" type="submit">Submit Feedback</button>
              <div class="form-result mt-3 d-none"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <a href="https://www.instagram.com/omkarhomestay.madikeri/" target="_blank" rel="noopener" class="instagram-float" aria-label="Instagram"><i class="fab fa-instagram"></i></a>

  <script src="js/animations.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
